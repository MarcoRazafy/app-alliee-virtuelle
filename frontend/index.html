<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>L'Alliée Virtuelle</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- PWA : installable + plein écran (iOS/Android) -->
    <meta name="theme-color" content="#256bff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Alliée" />
    <!-- Applique le thème avant le premier rendu pour éviter un flash de la mauvaise couleur -->
    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
            ? 'light'
            : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <!-- Applique le zoom d'affichage mémorisé (par appareil) avant le premier rendu -->
    <script>
      (function () {
        var z = Number(localStorage.getItem('ui-zoom'));
        if ([80, 90, 100, 110].indexOf(z) !== -1) {
          if (z !== 100) document.documentElement.style.zoom = String(z / 100);
          document.documentElement.style.setProperty('--ui-zoom', String(z / 100));
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html[data-theme='dark'] body { background: #07162d; }
      html[data-theme='light'] body { background: #f4f7fc; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
